
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SuperMINI - Gestión de Pedidos</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<!-- HEAD -->
<header class="encabezado">

    <div class="cabecera-superior">
        <h1>SuperMINI</h1>

        <div id="datosSesion" hidden>
            <span id="nombreSesion"></span>
            <button type="button"
                    id="btnCerrarSesion"
                    class="btn-salir">
                Cerrar sesión
            </button>
        </div>
    </div>

    <nav id="menuPrincipal"
         class="menu"
         aria-label="Navegación principal">
        <a href="#home" aria-current="page">Home</a>
    </nav>

</header>

<!-- BODY -->
<main class="contenido">

    <!-- LOGIN -->
    <section id="vistaLogin"
             class="login"
             aria-labelledby="tituloLogin">

        <h2 id="tituloLogin">Iniciar sesión</h2>

        <form id="formLogin"
              method="post"
              novalidate>

            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text"
                       id="usuario"
                       name="usuario"
                       autocomplete="username"
                       required>
            </div>

            <div class="campo">
                <label for="contrasena">
                    Contraseña
                </label>
                <input type="password"
                       id="contrasena"
                       name="contrasena"
                       autocomplete="current-password"
                       required>
            </div>

            <p id="mensajeError"
               class="mensaje-error"
               role="alert"
               hidden></p>

            <button type="submit"
                    class="btn-principal">
                Ingresar
            </button>

        </form>
    </section>

    <!-- CONTENIDO SEGÚN PERFIL -->
    <section id="vistaSistema"
             class="sistema"
             hidden>

        <div id="contenidoSistema"></div>

    </section>

</main>

<!-- FOOT: Pie de página -->
<footer class="pie">

    <nav id="menuFooter"
         aria-label="Navegación del pie">

        <a href="#home">Home</a>

        <a href="mailto:soporte@ejemplo.com">
            Contacto/Soporte
        </a>

        <a href="https://www.instagram.com/"
           target="_blank"
           rel="noopener noreferrer">
            Instagram
        </a>

        <a href="https://www.facebook.com/"
           target="_blank"
           rel="noopener noreferrer">
            Facebook
        </a>

    </nav>

    <p>© 2026 SuperMINI</p>

</footer>


<!-- MODAL CUENTA BLOQUEADA -->
<div id="modalBloqueo" class="modal" hidden>

    <div class="modal-contenido"
         role="alertdialog"
         aria-modal="true"
         aria-labelledby="mensajeBloqueo">

        <div class="icono-bloqueo" aria-hidden="true">
            <svg width="24" height="24"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.5"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <rect x="5" y="11"
                      width="14" height="10"
                      rx="2"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
        </div>

        <p id="mensajeBloqueo" tabindex="-1">
            Cuenta bloqueada
            <span>Ha superado los 3 intentos</span>
        </p>

    </div>

</div>


<script src="js/login.js"></script>

</body>
</html>
